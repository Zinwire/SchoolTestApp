name: Build MAUI App (.NET 10)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # Используем актуальный .NET 10

    - name: Install MAUI Workloads
      # Устанавливаем сразу оба ворклоада для Android и Windows
      run: dotnet workload install maui-android maui-windows

    - name: Restore Dependencies
      run: dotnet restore

    # --- СБОРКА ПОД ANDROID ---
    - name: Build Android App (Debug)
      run: dotnet build -c Debug -f net10.0-android --no-restore

    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: maui-app-android
        path: |
          **/bin/Debug/net10.0-android/*-Signed.apk

    # --- СБОРКА ПОД WINDOWS ---
    - name: Build Windows App (Debug)
      run: dotnet build -c Debug -f net10.0-windows10.0.19041.0 --no-restore

    # Упаковываем Windows-сборку, чтобы её было удобно скачать одним архивом
    - name: Upload Windows App
      uses: actions/upload-artifact@v4
      with:
        name: maui-app-windows
        path: |
          **/bin/Debug/net10.0-windows10.0.19041.0/win10-x64/
