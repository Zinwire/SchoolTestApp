name: MAUI Production Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install MAUI Workloads
      run: dotnet workload install maui-android maui-windows

    - name: Restore Dependencies
      run: dotnet restore

    # --- СБОРКА WINDOWS (Релиз в папку локальной сборки dist/windows) ---
    - name: Build Windows App (Release)
      run: dotnet publish -c Release -f net10.0-windows10.0.19041.0 -o dist/windows /p:GenerateAppxPackageOnBuild=false

    - name: Upload Windows App Artifact
      uses: actions/upload-artifact@v4
      with:
        name: maui-app-windows
        path: dist/windows/

    # --- СБОРКА ANDROID (Релиз в папку локальной сборки dist/android) ---
    - name: Build Android App (Release)
      run: dotnet publish -c Release -f net10.0-android -o dist/android

    - name: Upload Android APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: maui-app-android
        path: dist/android/*-Signed.apk
