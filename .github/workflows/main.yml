name: MAUI Production Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install MAUI Workloads
      run: dotnet workload install maui-android maui-windows

    - name: Restore Dependencies
      run: dotnet restore

    # --- СБОРКА WINDOWS ---
    - name: Build Windows App (Release)
      run: dotnet publish -c Release -f net10.0-windows10.0.19041.0 /p:GenerateAppxPackageOnBuild=false

    - name: Upload Windows App Artifact
      uses: actions/upload-artifact@v4
      with:
        name: maui-app-windows
        # Робот сам зайдет в bin и заберет всё содержимое папки публикации
        path: |
          **/bin/Release/net10.0-windows*/**/*.exe
          **/bin/Release/net10.0-windows*/**/*.dll
        if-no-files-found: warn

    # --- СБОРКА ANDROID ---
    - name: Build Android App (Release)
      # Строим билд, .NET сам создаст APK в папке net10.0-android
      run: dotnet build -c Release -f net10.0-android

    - name: Upload Android APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: maui-app-android
        # Сканируем весь проект на наличие любых скомпилированных APK
        path: |
          **/bin/Release/net10.0-android/*.apk
          **/bin/Release/net10.0-android/publish/*.apk
        if-no-files-found: warn
